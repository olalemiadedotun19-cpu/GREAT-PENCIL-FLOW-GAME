<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#f5f0e6"/>
  <!-- Paper texture grid lines -->
  <line x1="64" y1="0" x2="64" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="128" y1="0" x2="128" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="192" y1="0" x2="192" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="256" y1="0" x2="256" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="320" y1="0" x2="320" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="384" y1="0" x2="384" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="448" y1="0" x2="448" y2="512" stroke="#e6decb" stroke-width="2" />
  <line x1="0" y1="128" x2="512" y2="128" stroke="#e6decb" stroke-width="2" />
  <line x1="0" y1="256" x2="512" y2="256" stroke="#e6decb" stroke-width="2" />
  <line x1="0" y1="384" x2="512" y2="384" stroke="#e6decb" stroke-width="2" />
  
  <!-- Flowing pencil road ribbon -->
  <path d="M 60 420 C 140 420 180 320 260 300 C 340 280 380 180 440 140" fill="none" stroke="#2b2723" stroke-width="24" stroke-linecap="round"/>
  <path d="M 60 420 C 140 420 180 320 260 300 C 340 280 380 180 440 140" fill="none" stroke="#fdfbf7" stroke-width="12" stroke-linecap="round"/>

  <!-- Rolling Ball Sphere -->
  <circle cx="210" cy="275" r="48" fill="#fdfbf7" stroke="#2b2723" stroke-width="8"/>
  <ellipse cx="210" cy="275" rx="46" ry="18" fill="none" stroke="#2b2723" stroke-width="4" stroke-dasharray="6,4"/>
  <ellipse cx="210" cy="275" rx="18" ry="46" fill="none" stroke="#2b2723" stroke-width="4" stroke-dasharray="6,4"/>
  
  <!-- Speed lines -->
  <path d="M 120 290 Q 150 285 160 280" stroke="#726a61" stroke-width="4" stroke-linecap="round" />
  <path d="M 110 265 Q 140 260 155 260" stroke="#726a61" stroke-width="3" stroke-linecap="round" />

  <!-- Drawing Pencil -->
  <g transform="translate(420, 130) rotate(-45)">
    <polygon points="0,0 20,-50 40,0" fill="#dfab34" stroke="#2b2723" stroke-width="4"/>
    <polygon points="10,-25 20,-50 30,-25" fill="#2b2723"/>
    <rect x="0" y="0" width="40" height="90" fill="#e07272" stroke="#2b2723" stroke-width="4"/>
    <rect x="0" y="70" width="40" height="20" fill="#c0bcbc" stroke="#2b2723" stroke-width="3"/>
  </g>
</svg>
