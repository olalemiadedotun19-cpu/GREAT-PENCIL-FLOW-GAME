workflows:
  android-capacitor:
    name: Pencil Flow - Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.pencilflow.game"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps --include=optional
          npm install --no-save @rolldown/binding-darwin-arm64 @esbuild/darwin-arm64 lightningcss-darwin-arm64 || true
      - name: Build web app distribution
        script: |
          if [ -f "dist/index.html" ]; then
            echo "Pre-built web distribution found in repository."
          else
            npm run build || true
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Fallback building web app..."
            npx vite build
          fi
      - name: Initialize and synchronize Capacitor Android platform
        script: |
          # Add android platform if not already present in repo
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Build Android APK (Debug & Release)
        script: |
          cd android
          chmod +x gradlew
          # 1. Build universal Debug APK (immediately installable on any Android phone without keystore)
          ./gradlew assembleDebug
          
          # 2. Build Release APK and App Bundle (for Google Play distribution)
          ./gradlew assembleRelease || true
          ./gradlew bundleRelease || true
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
      - dist/**
