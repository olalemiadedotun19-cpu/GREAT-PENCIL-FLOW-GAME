workflows:
  android-capacitor:
    name: Pencil Flow - Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      vars:
        PACKAGE_NAME: "com.pencilflow.game"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps --include=optional || true
      - name: Build web app distribution
        script: |
          if [ -f "android/app/src/main/assets/public/index.html" ]; then
            echo "Production Android assets are already bundled in repository."
          elif [ -f "dist/index.html" ]; then
            echo "Found pre-built dist assets."
          else
            npm run build || echo "Using committed assets"
          fi
      - name: Initialize and synchronize Capacitor Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            npx cap sync android || true
          fi
          if [ ! -f "android/app/src/main/assets/public/index.html" ] && [ -d "dist" ]; then
            mkdir -p android/app/src/main/assets/public
            cp -r dist/* android/app/src/main/assets/public/ || true
          fi
      - name: Build Android APK (Debug & Release)
        script: |
          cd android
          chmod +x gradlew
          # 1. Build universal Debug APK (immediately installable on any Android phone without keystore)
          ./gradlew assembleDebug
          
          # 2. Build Release APK and App Bundle (for Google Play distribution)
          ./gradlew assembleRelease || true
          ./gradlew bundleRelease || true
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
