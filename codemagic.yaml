workflows:
  android-capacitor:
    name: Pencil Flow - Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      vars:
        PACKAGE_NAME: "com.pencilflow.game"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps --include=optional || true
      - name: Build web app distribution
        script: |
          if [ -f "android/app/src/main/assets/public/index.html" ]; then
            echo "Production Android assets are already bundled in repository."
          elif [ -f "dist/index.html" ]; then
            echo "Found pre-built dist assets."
          else
            npm run build || echo "Using committed assets"
          fi
      - name: Initialize and synchronize Capacitor Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            npx cap sync android || true
          fi
          if [ ! -f "android/app/src/main/assets/public/index.html" ] && [ -d "dist" ]; then
            mkdir -p android/app/src/main/assets/public
            cp -r dist/* android/app/src/main/assets/public/ || true
          fi
      - name: Build Android APK (Debug & Signed Release)
        script: |
          cd android
          chmod +x gradlew
          
          # Generate production release keystore if missing
          if [ ! -f "app/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias pencilflow \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass pencilflow123 \
              -keypass pencilflow123 \
              -dname "CN=Pencil Flow, OU=Mobile Games, O=Pencil Flow Studio, C=US"
          fi
          
          # 1. Build signed Production Release APK
          ./gradlew assembleRelease
          
          # 2. Build Release App Bundle (for Google Play distribution)
          ./gradlew bundleRelease || true
          
          # 3. Build Debug APK as backup
          ./gradlew assembleDebug || true
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/bundle/**/*.aab
